<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobación de Trazo</title><body><h1>Trazo 2 · comprobación nativa</h1><p>Esta pantalla pertenece solo al APK de prueba de compilación.</p><input type="file" accept="image/*" capture="environment"><button id="save">Guardar prueba</button><pre id="result"></pre><script>document.querySelector('#save').onclick=()=>TrazoNative.saveFile(btoa('Trazo prueba offline'),'Trazo-prueba.txt','text/plain');addEventListener('trazo-file-saved',e=>document.querySelector('#result').textContent=JSON.stringify(e.detail));</script></body></html>
